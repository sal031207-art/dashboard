name: Apply MCDH timetable monochrome theme
on:
  push:
    paths:
      - '.github/workflows/theme-embedded-platform.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update embedded timetable platform palette
        shell: bash
        run: |
          python3 - <<'PY'
            from pathlib import Path
            p=Path('index.html')
            s=p.read_text(encoding='utf-8')
            marker='// Shared monochrome palette for embedded MCDH timetable platform.'
            needle='          frame.srcdoc = platformDocument;'
            if marker not in s:
                assert s.count(needle)==1, 'Embedded platform injection point missing or ambiguous'
                s=s.replace(needle,"          // Shared monochrome palette for embedded MCDH timetable platform.\n          platformDocument = platformDocument.replace(/<\\/head>/i, '<style>:root{--paper:#F5F5F7;--paper-deep:#ECECF1;--surface:#FFF;--surface-soft:#F9F9FB;--ink:#1D1D1F;--ink-2:#424247;--muted:#6E6E73;--line:#E5E5EA;--line-strong:#D1D1D6;--jade:#29292D;--jade-dark:#1D1D1F;--jade-tint:#E8E8ED;--blue:#424247;--gold:#6E6E73;color-scheme:light}body{background:#F5F5F7;color:#1D1D1F}header,.sidebar,.site-header{border-color:#E5E5EA}button.active,.active[role=tab],button[aria-selected=true],button[aria-pressed=true]{background:#E8E8ED;color:#1D1D1F}button:focus-visible,a:focus-visible{outline-color:#6E6E73}@media(prefers-color-scheme:dark){:root{--paper:#161618;--paper-deep:#202024;--surface:#2C2C2E;--surface-soft:#353538;--ink:#F5F5F7;--ink-2:#E0E0E5;--muted:#AEAEB2;--line:#48484A;--line-strong:#5B5B60;--jade:#D2D2D8;--jade-dark:#F5F5F7;--jade-tint:#39393F;--blue:#C2C2C9;--gold:#AEAEB2;color-scheme:dark}body{background:#161618;color:#F5F5F7}header,.sidebar,.site-header{border-color:#48484A}button.active,.active[role=tab],button[aria-selected=true],button[aria-pressed=true]{background:#39393F;color:#F5F5F7}}</style></head>');\n"+'\n'+needle,1)
                p.write_text(s,encoding='utf-8')
            
          PY
      - name: Commit timetable styling update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Align embedded timetable platform to monochrome theme"; git push; fi
