name: Refresh silver app icon PNGs
on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-light-icon.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet cairosvg pillow
      - name: Render light icon sizes and verify
        run: |
          python3 - <<'PY'
          import io,cairosvg
          from pathlib import Path
          from PIL import Image
          svg=Path('app-icon-light.svg').read_bytes()
          for size in (180,192,512):
              buf=cairosvg.svg2png(bytestring=svg,output_width=size,output_height=size)
              img=Image.open(io.BytesIO(buf)).convert('RGB')
              assert img.size==(size,size)
              img.save(f'app-icon-light-{size}.png',optimize=True)
          PY
      - name: Commit refreshed assets and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-icon-light-180.png app-icon-light-192.png app-icon-light-512.png
          git rm .github/workflows/refresh-light-icon.yml
          git commit -m "style: refresh high contrast silver app icon images"
          git push
