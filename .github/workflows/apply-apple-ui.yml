name: Apply Apple UI link
on:
  push:
    branches: [apple-ui-redesign]
    paths: [.github/workflows/apply-apple-ui.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Insert stylesheet without altering existing logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          data=p.read_text(encoding="utf-8")
          tag='  <link rel="stylesheet" href="./apple-ui.css?v=1">\n'
          if tag not in data:
              assert "</head>" in data
              data=data.replace("</head>",tag+"</head>",1)
              p.write_text(data, encoding="utf-8")
          PY
      - name: Commit theme link and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-apple-ui.yml
          git add index.html
          git commit -m "style: activate Apple UI stylesheet" || exit 0
          git push
