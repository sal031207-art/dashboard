name: Generate light and dark iOS icons
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-dual-icons.yml
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate icon variants
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 - <<'PY'
          from pathlib import Path
          import json,io,cairosvg
          from PIL import Image
          for variant in ('light','dark'):
              raw=Path('app-icon-'+variant+'.svg').read_bytes()
              for size in (180,192,512):
                  png=cairosvg.svg2png(bytestring=raw,output_width=size,output_height=size)
                  Image.open(io.BytesIO(png)).convert('RGB').save(f'app-icon-{variant}-{size}.png',optimize=True)
              manifest={'id':'./','name':'教師工作台','short_name':'教師工作台','lang':'zh-Hant-HK','start_url':'./','scope':'./','display':'standalone',
                        'background_color':'#111113' if variant=='dark' else '#F5F5F7',
                        'theme_color':'#242427' if variant=='dark' else '#F5F5F7',
                        'icons':[{'src':f'./app-icon-{variant}-{size}.png','sizes':f'{size}x{size}','type':'image/png','purpose':'any'} for size in (192,512)]}
              Path('manifest-'+variant+'.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Replace page icon declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<link rel="icon" type="image/svg+xml"')
          end=s.index('<meta name="apple-mobile-web-app-title"',start)
          icons=(
            '<link rel="icon" type="image/svg+xml" data-dashboard-icon="favicon" href="./app-icon-dark.svg?v=3">\n'
            '<link rel="apple-touch-icon" data-dashboard-icon="touch" sizes="180x180" href="./app-icon-dark-180.png?v=3">\n'
            '<link rel="manifest" data-dashboard-icon="manifest" href="./manifest-dark.webmanifest?v=3">\n'
            '<script defer src="./icon-theme.js?v=3"></script>\n'
          )
          s=s[:start]+icons+s[end:]
          p.write_text(s,encoding='utf-8')
          assert s.count('data-dashboard-icon="touch"')==1
          assert s.count('data-dashboard-icon="favicon"')==1
          assert 'apple-ui.css' in s
          PY
      - name: Verify variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          for theme in ('dark','light'):
              for size in (180,192,512):
                  with Image.open(f'app-icon-{theme}-{size}.png') as im:
                      assert im.size == (size,size)
              assert json.loads(Path(f'manifest-{theme}.webmanifest').read_text())['icons']
          assert 'data-dashboard-icon="manifest"' in Path('index.html').read_text()
          PY
      - name: Commit dual themes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-icon-{dark,light}-{180,192,512}.png manifest-{dark,light}.webmanifest
          git rm .github/workflows/generate-dual-icons.yml
          git commit -m "style: install dual iOS icons for light and dark themes"
          git push
